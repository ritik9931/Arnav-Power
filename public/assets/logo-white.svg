<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoPrimaryGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#002B66"/>
    </linearGradient>
    <linearGradient id="logoSolarGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <filter id="logoGlowW" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE -->
  <g transform="translate(10, 10)">
    <path d="M 50,2 L 88,24 L 88,68 L 50,94 L 12,68 L 12,24 Z" 
          fill="url(#logoPrimaryGradW)" 
          stroke="#00D2FF" 
          stroke-width="2.5" 
          stroke-linejoin="round" />
    
    <circle cx="50" cy="48" r="32" fill="none" stroke="#00D2FF" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>
    <line x1="50" y1="14" x2="50" y2="82" stroke="#00D2FF" stroke-width="1.2" opacity="0.6"/>
    <line x1="16" y1="48" x2="84" y2="48" stroke="#00D2FF" stroke-width="1.2" opacity="0.6"/>
    
    <path d="M 32,32 L 68,26 L 76,58 L 24,58 Z" fill="url(#logoSolarGradW)" opacity="0.95" />
    <line x1="50" y1="29" x2="50" y2="58" stroke="#FFF" stroke-width="1" opacity="0.9"/>
    <line x1="28" y1="45" x2="72" y2="42" stroke="#FFF" stroke-width="1" opacity="0.9"/>

    <path d="M 50,38 C 45,38 41,42 41,47 C 41,54 50,66 50,66 C 50,66 59,54 59,47 C 59,42 55,38 50,38 Z" 
          fill="#00E5FF" 
          filter="url(#logoGlowW)"/>
    <circle cx="50" cy="46" r="3" fill="#FFFFFF"/>

    <path d="M 18,28 Q 50,6 82,28 Q 94,56 78,78" fill="none" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <circle cx="82" cy="28" r="2.5" fill="#FFC107"/>
  </g>

  <!-- TEXT TYPOGRAPHY -->
  <g transform="translate(125, 0)">
    <text x="0" y="52" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
          font-size="34" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#FFFFFF">
      ARNAV <tspan fill="#00D2FF">POWER</tspan>
    </text>

    <text x="2" y="76" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#38BDF8">
      SOLUTION &amp; SERVICES
    </text>

    <text x="2" y="96" 
          font-family="'Inter', sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="1.5" 
          fill="#94A3B8">
      GIS &amp; SURVEY SOLUTIONS  •  SOLAR POWER INFRASTRUCTURE
    </text>
  </g>
</svg>
